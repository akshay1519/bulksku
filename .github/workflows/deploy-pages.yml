# GitHub Pages deployment workflow for BulkSKU validation landing page
#
# HOW TO ACTIVATE:
#   1. Obtain a verified Lemon Squeezy checkout URL for BulkSKU ($39).
#   2. Set CHECKOUT_URL in index.html (search for "CHECKOUT_URL = null").
#   3. In your GitHub repo → Settings → Pages:
#        Source: GitHub Actions
#   4. Push a commit to `main`. This workflow will deploy automatically.
#
# DO NOT enable Pages or publish the site until step 1 is complete.
# Publishing a page with a disabled/missing checkout is misleading.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:    # allow manual trigger from Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML file exists
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found. Aborting deployment."
            exit 1
          fi
          echo "✅ index.html found ($(wc -c < index.html) bytes)"

      - name: Check checkout URL is configured
        run: |
          # Warn (but don't block) if CHECKOUT_URL is still null.
          # The site will show a "checkout not configured" notice to visitors,
          # which is honest. Block here only if you want a hard gate.
          if grep -q 'CHECKOUT_URL = null' index.html; then
            echo "⚠️  WARNING: CHECKOUT_URL is still null in index.html."
            echo "   Visitors will see a 'Checkout not yet configured' notice."
            echo "   Set a real Lemon Squeezy URL before promoting this page."
          else
            echo "✅ CHECKOUT_URL is configured."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the repo root — index.html is at the root
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
